[package]
name = "glm-cli"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "glmaxx"
path = "src/main.rs"

[[bin]]
name = "glmaxx-exl3-real-k3-v1"
path = "src/bin/exl3_real_k3_v1.rs"
required-features = ["cuda-ffi"]

[features]
default = []
cuda-ffi = ["glm-cuda/cuda-ffi", "glm-engine/cuda-ffi"]

[dependencies]
glm-cache = { path = "../glm-cache" }
glm-cuda = { path = "../glm-cuda" }
glm-engine = { path = "../glm-engine" }
glm-format = { path = "../glm-format" }
glm-reference = { path = "../glm-reference" }
glm-scheduler = { path = "../glm-scheduler" }
glm-serving = { path = "../glm-serving" }
glm-tokenizer = { path = "../glm-tokenizer" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
