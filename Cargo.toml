[workspace]
members = [
    "crates/glm-cache",
    "crates/glm-cli",
    "crates/glm-cuda",
    "crates/glm-engine",
    "crates/glm-format",
    "crates/glm-reference",
    "crates/glm-scheduler",
    "crates/glm-serving",
    "crates/glm-tokenizer",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92"
version = "0.1.0"

[workspace.dependencies]
libc = "0.2.183"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "allow"
